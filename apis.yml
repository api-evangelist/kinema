aid: kinema
name: Kinema
description: Kinema is a social cinema platform and independent film distribution service.
  It empowers independent filmmakers to release, control, and get paid for their films
  through global distribution, partner-driven and live screenings, and direct-to-audience
  streaming, with ownership retention, transparent weekly payouts, and real-time earnings
  dashboards. Hosts and community builders get screening software and event tools to
  turn any space into a movie house, in person or online, while audiences discover
  independent films and attend virtual or in-person screenings, directly supporting
  filmmakers through ticket and rental purchases.
